<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>calendid</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0a1628;
    --navy-mid:    #0f1e38;
    --navy-light:  #162440;
    --navy-border: #1e3050;
    --blue:        #7ec8e3;
    --blue-dim:    #4aa8c8;
    --blue-muted:  #2a4a6a;
    --white:       #e8f4ff;
    --muted:       #4a7090;
    --danger:      #e05555;
    --today:       #f0a030;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--navy-border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  header .logo {
    width: 36px; height: 36px;
    background: var(--blue-dim);
    color: var(--navy);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.02em;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }

  main {
    flex: 1;
    display: flex;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Calendar (left) ── */
  .calendar-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
    overflow: hidden;
    min-width: 0;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .cal-header h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .cal-nav {
    display: flex;
    gap: 6px;
  }

  .cal-nav button {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--navy-border);
    background: var(--navy-mid);
    color: var(--white);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, border-color 0.12s;
  }

  .cal-nav button:hover {
    background: var(--navy-light);
    border-color: var(--blue-muted);
  }

  .cal-nav .today-btn {
    width: auto;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .weekdays span {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 0;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    flex: 1;
    min-height: 0;
  }

  .day-cell {
    background: var(--navy-mid);
    border: 1px solid var(--navy-border);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    overflow: hidden;
    cursor: default;
    transition: border-color 0.12s, background 0.12s;
  }

  .day-cell:hover { border-color: var(--blue-muted); }

  .day-cell.other-month {
    opacity: 0.35;
  }

  .day-cell.today {
    border-color: var(--today);
    background: rgba(240, 160, 48, 0.08);
  }

  .day-cell.selected {
    border-color: var(--blue);
    background: rgba(126, 200, 227, 0.08);
  }

  .day-num {
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    flex-shrink: 0;
  }

  .day-cell.today .day-num {
    color: var(--today);
  }

  .day-events {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    flex: 1;
  }

  .day-event {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--navy);
    line-height: 1.4;
    flex-shrink: 0;
  }

  .day-more {
    font-size: 10px;
    color: var(--muted);
    padding-left: 4px;
  }

  /* ── Sidebar (right) ── */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--navy-mid);
    border-left: 1px solid var(--navy-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--navy-border);
  }

  .sidebar-section:last-child {
    border-bottom: none;
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .form-group input[type="text"],
  .form-group input[type="date"],
  .form-group input[type="time"] {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--navy-border);
    background: var(--navy-light);
    color: var(--white);
    font-size: 14px;
    outline: none;
    transition: border-color 0.12s;
  }

  .form-group input:focus {
    border-color: var(--blue-dim);
  }

  .form-group input[type="date"]::-webkit-calendar-picker-indicator,
  .form-group input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
    cursor: pointer;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .color-picker-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-picker-row input[type="color"] {
    width: 44px;
    height: 36px;
    border: 1px solid var(--navy-border);
    border-radius: 8px;
    padding: 2px;
    background: var(--navy-light);
    cursor: pointer;
  }

  .color-presets {
    display: flex;
    gap: 6px;
    flex: 1;
  }

  .color-preset {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }

  .color-preset:hover { transform: scale(1.15); }
  .color-preset.active { border-color: var(--white); }

  .add-btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--blue-dim);
    color: var(--navy);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s;
    margin-top: 4px;
  }

  .add-btn:hover { background: var(--blue); }

  /* Countdowns */
  .countdown-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }

  .countdown-list::-webkit-scrollbar { width: 4px; }
  .countdown-list::-webkit-scrollbar-thumb {
    background: var(--navy-border);
    border-radius: 2px;
  }

  .countdown-item {
    background: var(--navy-light);
    border: 1px solid var(--navy-border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    position: relative;
  }

  .countdown-item.past {
    opacity: 0.5;
  }

  .countdown-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .countdown-body { flex: 1; min-width: 0; }

  .countdown-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .countdown-date {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .countdown-time {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .countdown-time.soon { color: var(--today); }
  .countdown-time.past { color: var(--muted); font-size: 13px; font-weight: 500; }

  .delete-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.12s, color 0.12s, background 0.12s;
  }

  .countdown-item:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--danger); background: rgba(224, 85, 85, 0.1); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 32px 16px;
    line-height: 1.6;
  }

  @media (max-width: 860px) {
    main { flex-direction: column; overflow: auto; }
    .calendar-panel { min-height: 520px; }
    .sidebar {
      width: 100%;
      min-width: unset;
      border-left: none;
      border-top: 1px solid var(--navy-border);
    }
    .days-grid { min-height: 360px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <h1>calendid.one</h1>
  <p>Saved locally · no account needed</p>
</header>

<main>
  <section class="calendar-panel">
    <div class="cal-header">
      <h2 id="month-label"></h2>
      <div class="cal-nav">
        <button id="prev-month" title="Previous month">‹</button>
        <button class="today-btn" id="go-today">Today</button>
        <button id="next-month" title="Next month">›</button>
      </div>
    </div>
    <div class="weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="days-grid" id="days-grid"></div>
  </section>

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Add Event</div>
      <form id="event-form">
        <div class="form-group">
          <label for="event-title">Event name</label>
          <input type="text" id="event-title" placeholder="Birthday party, meeting…" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="event-date">Date</label>
            <input type="date" id="event-date" required />
          </div>
          <div class="form-group">
            <label for="event-time">Time</label>
            <input type="time" id="event-time" value="09:00" required />
          </div>
        </div>
        <div class="form-group">
          <label>Color</label>
          <div class="color-picker-row">
            <input type="color" id="event-color" value="#7ec8e3" />
            <div class="color-presets" id="color-presets"></div>
          </div>
        </div>
        <button type="submit" class="add-btn">Add to Calendar</button>
      </form>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Countdowns</div>
      <div class="countdown-list" id="countdown-list"></div>
    </div>
  </aside>
</main>

<script>
const STORAGE_KEY = 'calendar-events-v1';
const PRESET_COLORS = ['#7ec8e3', '#f0a030', '#e05555', '#6ecf8a', '#b48cf0', '#f078b6'];

let events = loadEvents();
let viewYear, viewMonth;
let selectedDate = null;

function loadEvents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function saveEvents() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function parseEventDate(ev) {
  const [y, m, d] = ev.date.split('-').map(Number);
  const [hh, mm] = ev.time.split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm, 0);
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function eventsForDate(key) {
  return events.filter(ev => ev.date === key).sort((a, b) => a.time.localeCompare(b.time));
}

function initView() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
}

function renderCalendar() {
  const label = document.getElementById('month-label');
  const grid = document.getElementById('days-grid');
  const monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  label.textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

  const today = new Date();
  const todayKey = dateKey(today);

  grid.innerHTML = '';

  for (let i = 0; i < 42; i++) {
    let dayNum, cellYear, cellMonth, otherMonth = false;

    if (i < startDow) {
      dayNum = daysInPrev - startDow + i + 1;
      cellMonth = viewMonth - 1;
      cellYear = viewMonth === 0 ? viewYear - 1 : viewYear;
      if (cellMonth < 0) cellMonth = 11;
      otherMonth = true;
    } else if (i - startDow >= daysInMonth) {
      dayNum = i - startDow - daysInMonth + 1;
      cellMonth = viewMonth + 1;
      cellYear = viewMonth === 11 ? viewYear + 1 : viewYear;
      if (cellMonth > 11) cellMonth = 0;
      otherMonth = true;
    } else {
      dayNum = i - startDow + 1;
      cellMonth = viewMonth;
      cellYear = viewYear;
    }

    const cellDate = new Date(cellYear, cellMonth, dayNum);
    const key = dateKey(cellDate);

    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (otherMonth) cell.classList.add('other-month');
    if (key === todayKey) cell.classList.add('today');
    if (key === selectedDate) cell.classList.add('selected');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = dayNum;
    cell.appendChild(numEl);

    const evContainer = document.createElement('div');
    evContainer.className = 'day-events';
    const dayEvents = eventsForDate(key);
    const maxShow = 3;

    dayEvents.slice(0, maxShow).forEach(ev => {
      const pill = document.createElement('div');
      pill.className = 'day-event';
      pill.style.background = ev.color;
      pill.textContent = ev.time.slice(0, 5) + ' ' + ev.title;
      pill.title = `${ev.title} at ${ev.time}`;
      evContainer.appendChild(pill);
    });

    if (dayEvents.length > maxShow) {
      const more = document.createElement('div');
      more.className = 'day-more';
      more.textContent = `+${dayEvents.length - maxShow} more`;
      evContainer.appendChild(more);
    }

    cell.appendChild(evContainer);

    cell.addEventListener('click', () => {
      selectedDate = key;
      document.getElementById('event-date').value = key;
      renderCalendar();
    });

    grid.appendChild(cell);
  }
}

function formatCountdown(ms) {
  if (ms <= 0) return null;

  const sec = Math.floor(ms / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);

  if (day > 0) {
    const remHr = hr % 24;
    return `${day}d ${remHr}h ${min % 60}m`;
  }
  if (hr > 0) return `${hr}h ${min % 60}m ${sec % 60}s`;
  if (min > 0) return `${min}m ${sec % 60}s`;
  return `${sec}s`;
}

function formatEventDate(ev) {
  const d = parseEventDate(ev);
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
    + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function renderCountdowns() {
  const list = document.getElementById('countdown-list');
  const now = Date.now();

  const sorted = [...events].sort((a, b) => parseEventDate(a) - parseEventDate(b));

  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-state">No events yet.<br>Add one above to start a countdown.</div>';
    return;
  }

  list.innerHTML = '';

  sorted.forEach(ev => {
    const target = parseEventDate(ev).getTime();
    const diff = target - now;
    const isPast = diff <= 0;
    const isSoon = !isPast && diff < 86400000;

    const item = document.createElement('div');
    item.className = 'countdown-item' + (isPast ? ' past' : '');

    const dot = document.createElement('div');
    dot.className = 'countdown-dot';
    dot.style.background = ev.color;

    const body = document.createElement('div');
    body.className = 'countdown-body';

    const title = document.createElement('div');
    title.className = 'countdown-title';
    title.textContent = ev.title;

    const dateLine = document.createElement('div');
    dateLine.className = 'countdown-date';
    dateLine.textContent = formatEventDate(ev);

    const timeEl = document.createElement('div');
    timeEl.className = 'countdown-time' + (isPast ? ' past' : isSoon ? ' soon' : '');
    timeEl.dataset.eventId = ev.id;

    if (isPast) {
      timeEl.textContent = 'Passed';
    } else {
      timeEl.textContent = formatCountdown(diff);
    }

    body.appendChild(title);
    body.appendChild(dateLine);
    body.appendChild(timeEl);

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.title = 'Remove event';
    del.textContent = '×';
    del.addEventListener('click', () => {
      events = events.filter(e => e.id !== ev.id);
      saveEvents();
      renderCalendar();
      renderCountdowns();
    });

    item.appendChild(dot);
    item.appendChild(body);
    item.appendChild(del);
    list.appendChild(item);
  });
}

function tickCountdowns() {
  const now = Date.now();
  document.querySelectorAll('.countdown-time:not(.past)').forEach(el => {
    const ev = events.find(e => e.id === el.dataset.eventId);
    if (!ev) return;
    const diff = parseEventDate(ev).getTime() - now;
    if (diff <= 0) {
      el.textContent = 'Passed';
      el.classList.add('past');
      el.closest('.countdown-item')?.classList.add('past');
    } else {
      el.textContent = formatCountdown(diff);
      if (diff < 86400000) el.classList.add('soon');
    }
  });
}

/* Color presets */
const presetsEl = document.getElementById('color-presets');
const colorInput = document.getElementById('event-color');

PRESET_COLORS.forEach(c => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'color-preset' + (c === colorInput.value ? ' active' : '');
  btn.style.background = c;
  btn.dataset.color = c.toLowerCase();
  btn.addEventListener('click', () => {
    colorInput.value = c;
    presetsEl.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  presetsEl.appendChild(btn);
});

colorInput.addEventListener('input', () => {
  const val = colorInput.value.toLowerCase();
  presetsEl.querySelectorAll('.color-preset').forEach(b => {
    b.classList.toggle('active', b.dataset.color === val);
  });
});

/* Form */
document.getElementById('event-form').addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('event-title').value.trim();
  const date = document.getElementById('event-date').value;
  const time = document.getElementById('event-time').value;
  const color = document.getElementById('event-color').value;

  if (!title || !date || !time) return;

  events.push({ id: uid(), title, date, time, color });
  saveEvents();

  document.getElementById('event-title').value = '';
  selectedDate = date;

  const [y, m] = date.split('-').map(Number);
  viewYear = y;
  viewMonth = m - 1;

  renderCalendar();
  renderCountdowns();
});

/* Navigation */
document.getElementById('prev-month').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});

document.getElementById('next-month').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

document.getElementById('go-today').addEventListener('click', () => {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  selectedDate = dateKey(now);
  document.getElementById('event-date').value = selectedDate;
  renderCalendar();
});

/* Default date to today */
const todayStr = dateKey(new Date());
document.getElementById('event-date').value = todayStr;
selectedDate = todayStr;

initView();
renderCalendar();
renderCountdowns();
setInterval(tickCountdowns, 1000);
</script>
</body>
</html>
